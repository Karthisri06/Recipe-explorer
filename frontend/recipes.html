<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore Recipes - Food Recipe</title>
  <link href="dist/styles.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Text:ital@0;1&family=Quicksand:wght@500..700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script> <!-- Tailwind CSS -->
  <link href="theme.css" rel="stylesheet">
</head>
<body id="top" class="font-quicksand soft p-4">
  <header class="soft-bar sticky top-3 z-40 flex flex-wrap gap-3 justify-between items-center py-3 max-w-7xl mx-auto px-5">
    <a href="#top" class="flex items-center gap-3" aria-label="Food Recipe home">
      <img src="assets/logo.png" alt="" class="logo-badge">
      <span class="text-yellow-600 text-2xl font-fun font-serif">Food Recipe</span>
    </a>
    <nav class="hidden md:flex items-center gap-2 text-sm font-semibold text-yellow-800" aria-label="Main">
      <a href="#top" class="rounded-full px-4 py-2 hover:bg-white">Home</a>
      <a href="#recipes" class="rounded-full px-4 py-2 hover:bg-white">Explore</a>
    </nav>
    <div class="flex items-center bg-white rounded-full px-4 py-2 flex-1 max-w-md shadow-sm">
      <i class="fas fa-search text-gray-400 mr-2"></i>
      <input id="search" type="search" aria-label="Search recipes" placeholder="Search by name, ingredient or country" class="bg-transparent outline-none text-gray-700 w-full">
    </div>
    <div class="flex items-center gap-3">
      <span class="avatar" data-avatar aria-hidden="true"></span>
      <button type="button" data-signout class="soft-button bg-yellow-600 hover:bg-orange-600 text-white text-sm font-semibold py-2 px-4">Sign out</button>
    </div>
  </header>

  <!-- Recipe of the day -->
  <section class="relative max-w-7xl mx-auto mt-6 rounded-3xl overflow-hidden bg-orange-200 shadow-lg">
    <img id="hero-image" alt="" class="w-full h-96 object-cover">
    <div class="photo-fade absolute inset-0 flex flex-col justify-end items-start p-8 text-white">
      <h2 class="text-lg font-semibold tracking-wide text-orange-100">Recipe of the day</h2>
      <h1 id="hero-title" class="mt-2 text-amber-200 font-fun font-serif text-3xl md:text-5xl">Loading...</h1>
      <p id="hero-blurb" class="mt-3 text-base md:text-lg max-w-2xl"></p>
      <a id="hero-link" href="#" class="soft-button hidden mt-5 bg-yellow-600 hover:bg-orange-600 text-white font-semibold py-2 px-5">
        View Recipe <i class="fas fa-arrow-right ml-2"></i>
      </a>
    </div>
  </section>

  <!-- Recipes -->
  <section id="recipes" class="soft-card scroll-mt-28 relative text-black p-6 mt-6 max-w-7xl mx-auto">
    <h2 class="text-2xl font-semibold mb-4 text-yellow-600">Explore Recipes</h2>

    <div id="categories" class="flex flex-wrap gap-2 mb-4" aria-label="Filter by category"></div>
    <p id="result-count" class="text-sm text-gray-500 mb-4" aria-live="polite"></p>

    <div id="recipes-error" class="hidden bg-red-50 text-red-700 rounded-2xl p-4 mb-4" role="alert">
      <span id="recipes-error-text"></span>
      <button type="button" id="retry" class="ml-3 underline font-semibold">Try again</button>
    </div>

    <div id="recipe-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>

    <p id="loading" class="text-center text-gray-500 py-8">Loading recipes...</p>
    <p id="no-results" class="hidden text-center text-gray-500 py-8">No recipes match your search.</p>

    <div class="text-center mt-6">
      <button type="button" id="load-more" class="soft-button hidden bg-yellow-600 hover:bg-orange-600 text-white font-semibold py-3 px-8">Load more recipes</button>
    </div>
  </section>

  <footer class="text-center text-sm text-gray-500 py-6">
    Recipes provided by <a href="https://www.themealdb.com" target="_blank" rel="noopener" class="underline">TheMealDB</a>
  </footer>

  <script src="app.js"></script>
  <script src="chat.js"></script>
  <script src="home.js"></script>
</body>
</html>
