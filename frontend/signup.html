<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up - Food Recipe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Text:ital@0;1&family=Quicksand:wght@500..700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script> <!-- Tailwind CSS -->
  <link href="theme.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Quicksand', sans-serif;
    }
    .font-fun {
      font-family: 'DM Serif Text', serif;
    }
  </style>
</head>

<body class="bg-cover bg-center min-h-screen flex items-center justify-center px-4" style="background-image: url('assets/bg.jpg');">
  <div class="soft-card max-w-sm w-full p-8 space-y-6" style="background: rgba(255, 255, 255, 0.95);">
    <div class="text-center">
      <img src="assets/logo.png" alt="Food Recipe logo" class="logo-badge mx-auto mb-3" style="width: 4rem; height: 4rem;">
      <h1 class="text-2xl font-bold text-yellow-600 font-fun">Food Recipe</h1>
      <p class="text-lg text-gray-500 mt-2">Create your account</p>
    </div>

    <form id="signup-form" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1" for="email">Email</label>
        <input type="email" name="email" id="email" autocomplete="email" class="soft-input w-full p-3" placeholder="example@mail.com" required>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1" for="password">Password</label>
        <input type="password" name="password" id="password" autocomplete="new-password" minlength="6" data-toggle-password class="soft-input w-full p-3" required>
        <p class="text-xs text-gray-500 mt-1">At least 6 characters</p>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1" for="confirmPassword">Confirm Password</label>
        <input type="password" name="confirmPassword" id="confirmPassword" autocomplete="new-password" data-toggle-password class="soft-input w-full p-3" required>
        <p id="match-message" class="text-sm mt-1" aria-live="polite"></p>
      </div>

      <p id="form-message" class="hidden" role="alert"></p>
      <button type="submit" class="soft-button w-full bg-yellow-600 text-white font-semibold py-3 px-4 hover:bg-orange-600">
        Sign up
      </button>
    </form>

    <p class="text-sm text-center text-gray-500">
      Already have an account? <a href="index.html" class="text-yellow-600 font-semibold">Sign in</a>
    </p>
  </div>

  <script src="app.js"></script>
  <script src="signup.js"></script>
</body>
</html>
