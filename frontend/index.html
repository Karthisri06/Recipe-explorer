<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in - Food Recipe</title>
  <link href="./dist/styles.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Text:ital@0;1&family=Quicksand:wght@500..700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script> <!-- Tailwind CSS -->
  <link href="theme.css" rel="stylesheet">
</head>
<body class="bg-pattern bg-repeat min-h-screen flex items-center justify-center font-body px-4" style="background-image: url('assets/bg.jpg');">
  <div class="soft-card max-w-sm w-full p-8 space-y-5" style="background: rgba(255, 255, 255, 0.95);">
    <div class="text-center">
      <img src="./assets/logo.png" alt="Food Recipe logo" class="logo-badge mx-auto mb-3" style="width: 4rem; height: 4rem;">
      <h1 class="text-2xl font-bold text-custom-orange font-fun">Food Recipe</h1>
      <p class="text-lg text-gray-500 mt-2">Welcome back! Sign in to continue.</p>
    </div>

    <form id="signin-form" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1" for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" class="soft-input w-full p-3" placeholder="example@mail.com" required>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1" for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" data-toggle-password class="soft-input w-full p-3" required>
      </div>
      <p id="form-message" class="hidden" role="alert"></p>
      <button class="soft-button w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold p-3" type="submit">Sign in</button>
    </form>

    <p class="text-sm text-center text-gray-500">
      Don’t have an account? <a href="signup.html" class="text-orange-500 font-semibold">Sign up</a>
    </p>
  </div>

  <script src="app.js"></script>
  <script src="signin.js"></script>
</body>
</html>
